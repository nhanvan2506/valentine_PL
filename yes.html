<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Yayyyy! 💖</title>
 <style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ff9aa2, #ffd4e0);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: system-ui, sans-serif;
    text-align: center;
    overflow: hidden;
  }
  .container {
    width: 100%;
    max-width: 1200px;          /* ← wider on big screens */
    padding: 20px;
    box-sizing: border-box;
  }
  h1 {
    font-size: clamp(2rem, 6vw, 4rem);  /* responsive font */
    margin: 0 0 20px;
    text-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  .video-wrapper {
    position: relative;
    width: 100%;
    padding-bottom: 177.78%;     /* ← 9:16 for vertical/portrait videos (common for phone clips) */
    height: 0;
    overflow: hidden;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .video-wrapper iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
  }
  p {
    font-size: 1.4rem;
    margin-top: 30px;
  }

  /* For landscape (16:9) videos, change padding-bottom to 56.25% instead */
  /* @media (min-aspect-ratio: 13/9) { .video-wrapper { padding-bottom: 56.25%; } } */
</style>
</head>
<body>
  <div class="container">
    <h1> 🥰💕</h1>
    
    <div class="video-wrapper">
      <iframe 
        src="https://streamable.com/e/o03wc8?autoplay=1" 
        frameborder="0" 
        allowfullscreen 
        allow="autoplay; fullscreen">
      </iframe>
    </div>
    
    <p>Cưng chờ anh 😘</p>
  </div>
</body>
</html>
